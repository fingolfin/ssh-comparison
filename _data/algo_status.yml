# Security status of individual algorithms, shown in the id column of the
# comparison tables. Statuses are secure, weak and broken; an id absent
# from this file is unrated.
#
# weak:   deprecated, or attackable only in theory or at impractical cost
# broken: practically attackable today
#
# An id is rated only when its defining document (see specs.yml) states
# the construction. Ids defined only by name, or only in source code, are
# left out.
