<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <!-- DataTables 3 + FixedColumns 6, pinned and integrity-checked. No jQuery:
       DataTables has not required it since v2. -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/v/dt/dt-3.1.5/fc-6.1.2/datatables.min.css"
        integrity="sha384-575hUVQIzBYJE2jjMxVVxnc31cEYGpgcec7bZM0EGrclixJU1sAcZKnLyUsn09a8"
        crossorigin="anonymous">
  <script defer
          src="https://cdn.datatables.net/v/dt/dt-3.1.5/fc-6.1.2/datatables.min.js"
          integrity="sha384-8jMX9B8ukJGoxfeWguBaT7Hm3HgdtlXyMqez8wzPOy+mlvIPcoSIS7mkmyzf3DIS"
          crossorigin="anonymous"></script>
</head>
