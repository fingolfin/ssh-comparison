---
layout: default
scroll: true
---

<nav id="cmp-switcher">
<ul>
{% for class in site.data.proto_classes %}
  <li><a{% if page.type == class[0] %} class="active"{% endif %} href="{{ site.baseurl }}/comparison/{{ class[0] }}.html">{{ class[1] }}</a></li>
{% endfor %}
</ul>
</nav>

<br>

{% if layout.scroll %}
<table id='cmp-table-{{ page.type }}' class='impl-comparison table-header-rotated compact'>
{% include cmp-table-content.html type=page.type scroll=true %}
</table>

<script>
// Freeze the algorithm id on the left and the implementation count on the
// right, so both stay readable while scrolling across 60-odd columns.
document.addEventListener('DOMContentLoaded', function () {
    new DataTable('#cmp-table-{{ page.type }}', {
        scrollY:        '700px',
        scrollX:        true,
        scrollCollapse: true,
        paging:         false,
        searching:      false,
        info:           false,
        fixedColumns:   {
            start: 1,
            end:   1
        }
    });
});
</script>

{% else %}

<div class='cmp-table-parent'>
<table id='cmp-table-{{ page.type }}' class='impl-comparison table-header-rotated'>
{% include cmp-table-content.html type=page.type scroll=false %}
</table>
</div>

{% endif %}
