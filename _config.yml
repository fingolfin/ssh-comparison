# Site settings
title: SSH implementation comparison
#email: your-email@domain.com
description: > # this means to ignore newlines until "baseurl:"
  A technical comparison of various SSH implementations (clients, servers and
  libraries), in terms of supported SSH crypto protocols.
# How to record a client and submit the result; linked from the front page
# and from entries marked help-wanted.
contributing_url: https://github.com/fingolfin/ssh-comparison/blob/gh-pages/README.md#contributing
baseurl: "" # the subpath of your site, e.g. /blog/
#url: "http://yourdomain.com" # the base hostname & protocol for your site
#twitter_username: jekyllrb
#github_username:  jekyll

# Build settings
markdown: kramdown

plugins:
  - jekyll-redirect-from

# Jekyll appends its own defaults (Gemfile, Gemfile.lock, vendor/bundle/, ...)
# to this list.
exclude: [ssh-detect.py, validate-data.rb, README.md, TODO.md]

collections:
  impls:
    output: true
  attacks:
    output: true
    permalink: /attacks/:name.html

defaults:
  - scope:
      path: ""
      type: impls
    values:
      layout: impl
  - scope:
      path: ""
      type: attacks
    values:
      layout: attack
